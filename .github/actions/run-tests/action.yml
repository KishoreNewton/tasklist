name: Run the tests
description: Set up Python and run the unit tests

inputs:
  python-version:
    description: The Python version to test with
    default: "3.14"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - run: python -m unittest -v
      shell: bash
