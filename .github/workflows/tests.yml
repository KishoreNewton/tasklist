name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests

  try-it:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tasks.py add "Buy milk"
      - run: python3 tasks.py list
      - if: runner.debug == '1'
        run: cat tasks.json

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git archive -o tasklist.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: tasklist
          path: tasklist.zip
